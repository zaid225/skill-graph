name = "skillgraph-backend"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# nodejs_compat gives the Worker real node:net / node:tls, which neo4j-driver's
# Bolt channel needs to speak bolt+s://. The compatibility_date matters as much
# as the flag here — older dates ship a thinner node:tls that leaves the
# driver's TLS handshake hanging until it times out.
compatibility_flags = ["nodejs_compat"]

# Free-tier Worker; adjust as needed
workers_dev = true

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Secrets (DO NOT put real values here — this file is committed to git).
#
# Set them with:
#   wrangler secret put COGNODB_URI
#   wrangler secret put COGNODB_USER
#   wrangler secret put COGNODB_PASSWORD
#
# For local development, put the same three vars into a `.dev.vars` file
# (see .dev.vars.example) which wrangler dev loads automatically and which
# is gitignored.
# ---------------------------------------------------------------------------

[vars]
# Non-secret example placeholders (overridden by real secrets in prod)
ENVIRONMENT = "development"
